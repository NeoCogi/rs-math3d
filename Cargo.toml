[package]
name = "rs-math3d"
version = "0.20.1"
license = "BSD-3-Clause"
authors = [
    "Raja Lehtihet <raja.lehtihet@gmail.com>",
    "Wael El Oraiby <wael.eloraiby@gmail.com>",
]
edition = "2018"
description = "2D/3D math for graphics and geometry, with explicit no_std support"
repository = "https://github.com/NeoCogi/rs-math3d"
readme = "README.md"
# Local agent instructions are workspace tooling, not part of the published crate.
exclude = [".agents/**"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num-traits = { version = "0.2", default-features = false }
libm = { version = "0.2", optional = true }
glow = { version = "0.18", optional = true }
sdl2 = { version = "0.38", features = ["use-pkgconfig"], optional = true }

[lib]

[[example]]
name = "inverse_modes"
required-features = ["std"]

[[example]]
name = "collision_bench"
required-features = ["std"]

[[example]]
name = "cordic_bench"
required-features = ["std"]

[[example]]
name = "mesh_bench"
required-features = ["std"]

[[example]]
name = "physics_headless"
required-features = ["std"]

[[example]]
name = "physics_bench"
required-features = ["std"]

[[example]]
name = "physics_replay"
required-features = ["std"]

[[example]]
name = "physics_demo"
required-features = ["physics-demo"]

[features]
# Hosted applications, including `#![no_std]` crates that can explicitly link
# Rust's standard library, use its floating-point operations by default.
default = ["std"]
# The standard-library backend also enables num-traits' standard-library support.
std = ["num-traits/std"]
# Std-free float analytics opt into libm; fixed-only builds need no backend.
libm = ["dep:libm"]
# The system C math backend is selected only when std/libm are disabled and is
# accepted only on Unix targets; source-level cfgs enforce that target policy.
system-libm = []
# Hosted visualization only; headless physics and no_std users do not enable GL/SDL.
physics-demo = ["std", "dep:glow", "dep:sdl2"]
